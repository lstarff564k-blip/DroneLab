<style>
:root{color-scheme:dark;--bg:#070b10;--pn:rgba(9,14,21,.8);--tx:#e9f0f6;--mu:#8da0b3;--ln:rgba(150,185,215,.17);--ac:#b4e50d;--ak:#0a1200;--gl:rgba(180,229,13,.38);--fd:"Chakra Petch","Avenir Next Condensed","Segoe UI",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.45 Manrope,"Avenir Next","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:var(--tx);text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--ln);border-radius:6px;padding:10px 12px;cursor:pointer;touch-action:manipulation;transition:background .15s,border-color .15s,box-shadow .15s}
button:hover{background:rgba(180,229,13,.07);border-color:rgba(180,229,13,.5)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on{border-color:var(--ac);background:linear-gradient(135deg,rgba(180,229,13,.2),rgba(180,229,13,.04));box-shadow:0 0 0 1px var(--ac),0 0 20px -6px var(--gl)}
button:disabled{opacity:.4;cursor:not-allowed}
small{display:block;color:var(--mu);font-size:11px;margin-top:1px}
#menu{position:fixed;inset:auto 0 0 0;max-height:68%;overflow:auto;background:var(--pn);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);border-top:1px solid var(--ln);border-radius:16px 16px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@container (min-width:700px){#menu{inset:0 auto 0 0;width:400px;max-height:none;border:0;border-right:1px solid var(--ln);border-radius:0;padding-top:calc(22px + env(safe-area-inset-top,0px))}}
.brand{display:flex;align-items:center;gap:14px}.brand img{width:54px;height:54px;border-radius:12px;box-shadow:0 0 0 1px var(--ln),0 10px 28px -10px var(--gl)}
h1{margin:0;font:700 30px/1 var(--fd);letter-spacing:.02em}
h2{margin:20px 0 8px;font:600 13px var(--fd);color:#b9c8d8;letter-spacing:.04em}
h2::before{content:"";display:inline-block;width:12px;height:3px;margin-right:8px;background:var(--ac);transform:skewX(-35deg);vertical-align:middle}
.sub{margin:5px 0 0;color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1;min-width:92px}
.sw>button{flex:0 0 34px;min-width:34px;height:34px;padding:0;border-radius:50%}
.st{display:grid;grid-template-columns:92px 1fr 70px;gap:8px;align-items:center;margin:7px 0;font-size:13px}.st b{text-align:right;font:600 13px var(--fd)}
.bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6c9a00,var(--ac));border-radius:3px;transition:width .3s}
#info,#hint{color:var(--mu);margin:8px 0 0;font-size:12.5px}
label{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--mu)}input{accent-color:var(--ac)}
.go{display:flex;gap:8px;margin-top:20px}.go button{flex:1;padding:14px;text-align:center;font:700 16px var(--fd);letter-spacing:.04em}
#go{background:var(--ac);color:var(--ak);border:0;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}#go:hover{background:#c8f52a}
#hud{display:none;pointer-events:none}.run #hud{display:block}#hud button{pointer-events:auto}
#tele,#score,#set{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--pn);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:4px;padding:8px 12px;font:500 13px var(--fd)}
#tele{left:10px;min-width:164px;border-left:3px solid var(--ac)}#tele div{display:flex;justify-content:space-between;gap:12px;color:var(--mu)}#tele b,#score b{font-weight:600;font-variant-numeric:tabular-nums}#tele b{color:var(--tx)}#score b{color:var(--ac)}
.bat{display:block;height:6px;background:rgba(255,255,255,.1);border-radius:3px;margin-top:6px}.bat i{display:block;height:100%;background:var(--ac);border-radius:3px}.low i{background:#ff4d57}
#score{left:50%;transform:translateX(-50%);display:flex;gap:16px;white-space:nowrap}
#set{right:10px;text-align:center}
@container (max-width:700px){#score{top:calc(env(safe-area-inset-top,0px) + 92px);left:10px;transform:none}}
#cross{position:fixed;left:50%;top:50%;width:30px;height:30px;margin:-15px;display:none}#cross::before,#cross::after{content:"";position:absolute;background:var(--ac);box-shadow:0 0 0 1px #000a,0 0 8px var(--gl)}#cross::before{left:14px;top:0;width:2px;height:30px}#cross::after{top:14px;left:0;height:2px;width:30px}
.pip{position:fixed;width:min(260px,40%);aspect-ratio:100/62;border:1px solid var(--ac);border-radius:4px;box-shadow:0 0 14px -4px var(--gl);display:none;pointer-events:none;font:600 11px var(--fd)}.pip span{position:absolute;left:6px;top:4px;color:var(--ac);text-shadow:0 1px 3px #000}
.gx{background:linear-gradient(var(--ac),var(--ac)) center/2px 38% no-repeat,linear-gradient(var(--ac),var(--ac)) center/24% 2px no-repeat}
#gcam{right:10px;top:calc(env(safe-area-inset-top,0px) + 54px)}#rcam{left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 54px);width:min(220px,36%)}#bm{left:16px;bottom:calc(57% + 72px)}#br{right:16px;bottom:calc(57% + 72px)}
#land{position:fixed;left:16px;bottom:calc(57% - 72px);width:62px;height:62px;border-radius:50%;padding:0;background:var(--pn);color:var(--tx);border:1px solid var(--ln);font:700 13px var(--fd);pointer-events:auto;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}#land:active{background:var(--ac);color:var(--ak)}
#tut{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(3,6,10,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}.tc{width:min(420px,90%);max-height:86%;overflow:auto;background:var(--pn);border:1px solid var(--ln);border-left:3px solid var(--ac);border-radius:6px;padding:20px}#tn{color:var(--mu);font:600 12px var(--fd);letter-spacing:.08em;text-transform:uppercase}#tt{margin:6px 0 8px;font:700 22px var(--fd);color:var(--tx)}#tp{margin:0 0 14px;color:var(--tx);line-height:1.55;font-size:15px}#td{display:flex;gap:6px;margin-bottom:16px}#td i{width:8px;height:8px;border-radius:50%;background:var(--ln)}#td i.on{background:var(--ac)}.tr{display:flex;gap:8px}.tr button{flex:1;padding:12px;font:700 14px var(--fd);border-radius:4px;background:transparent;color:var(--tx);border:1px solid var(--ln)}.tr #tx{background:var(--ac);color:var(--ak);border-color:var(--ac)}
#frame{position:fixed;inset:0;overflow:hidden;container-type:inline-size;background:var(--bg)}#frame.dev{border-radius:22px;box-shadow:0 0 0 8px #10161d,0 0 0 9px #2a3441,0 24px 70px #000}
#gear{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:64px;z-index:50;width:44px;height:44px;border-radius:50%;display:none;align-items:center;justify-content:center;padding:0;background:var(--pn);color:var(--tx);border:1px solid var(--ln);font:22px/1 var(--fd);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}body:not(.run) #gear{display:flex}
#gmenu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);right:12px;z-index:51;display:none;flex-direction:column;gap:6px;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}body:not(.run) #gmenu.o{display:flex}#gmenu button{background:transparent;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:8px 14px;min-width:150px;text-align:left;font:600 14px var(--fd)}#gmenu button small{display:block;color:var(--mu);font-weight:500;font-size:11px}#gmenu button.on{border-color:var(--ac);color:var(--ac)}
#mtog{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:50;width:44px;height:44px;border-radius:50%;display:none;align-items:center;justify-content:center;padding:0;background:var(--pn);color:var(--tx);border:1px solid var(--ln);font:700 28px/1 var(--fd);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}body:not(.run) #mtog{display:flex}#mtog:active{background:var(--ac);color:var(--ak)}
#cam{position:fixed;inset:0;pointer-events:none;display:none;font:600 13px var(--fd);color:#fff;text-shadow:0 1px 3px #000;letter-spacing:.06em;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%)}body.run.fpv #cam{display:block}body.run.fpv #c{filter:contrast(1.08) saturate(1.08)}
